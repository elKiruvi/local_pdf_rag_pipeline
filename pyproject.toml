[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-pdf-rag-pipeline"
version = "0.1.0"
description = "A local PDF retrieval-augmented generation demonstration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pymupdf>=1.25,<3",
  "numpy>=2,<3",
  "faiss-cpu>=1.10,<2",
  "ollama>=0.5,<1",
]

[project.scripts]
pdf-rag = "local_pdf_rag_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "pre-commit>=4,<5",
  "build>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_pdf_rag_pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=local_pdf_rag_pipeline --cov-report=term-missing --cov-fail-under=90"
