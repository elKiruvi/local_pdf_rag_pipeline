name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: locked-publication-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check publication policy
        run: python3 scripts/check_repository.py --history
      - name: Scan reachable history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sample="ghp_$(printf '%s' 'A7sT4vR9kL3mN6pQ2wX8yZ5bC1dE0fG4hJ7i')"
          mkdir "$RUNNER_TEMP/negative-scan"
          printf 'api_key: %s\n' "$sample" >"$RUNNER_TEMP/negative-scan/sample.txt"
          if "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --log-level error \
            "$RUNNER_TEMP/negative-scan" >"$RUNNER_TEMP/negative-scan.log" 2>&1; then
            echo 'FAIL: synthetic secret was not rejected'
            exit 1
          fi
          if grep --fixed-strings --quiet "$sample" "$RUNNER_TEMP/negative-scan.log"; then
            echo 'FAIL: synthetic secret was disclosed'
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-level error --log-opts='--all' .
  quality:
    name: locked-offline-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12.14
          uv lock --check
          uv sync --locked --dev
      - name: Pre-commit and publication hygiene
        run: |
          uv run --locked pre-commit run --all-files
          uv run --locked python scripts/check_repository.py --history
      - name: Offline tests and coverage
        run: uv run --locked pytest -q
      - name: Packaging smoke test
        run: |
          uv run --locked python -m build
          uv run --locked python -c 'import local_pdf_rag_pipeline; print(local_pdf_rag_pipeline.__version__)'
  audit:
    name: locked-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.9"
          enable-cache: false
      - run: uv audit --locked
