name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: locked-offline-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: false
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12.14
          uv lock --check
          uv sync --locked --dev
      - name: Pre-commit and publication hygiene
        run: |
          uv run --locked pre-commit run --all-files
          uv run --locked python scripts/check_repository.py --history
      - name: Offline tests and coverage
        run: uv run --locked pytest -q
      - name: Packaging smoke test
        run: |
          uv run --locked python -m build
          uv run --locked python -c 'import local_pdf_rag_pipeline; print(local_pdf_rag_pipeline.__version__)'
  audit:
    name: locked-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: false
      - run: uv audit --locked
